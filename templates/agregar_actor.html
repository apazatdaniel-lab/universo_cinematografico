{% extends "base.html" %}

{% block titulo %}Añadir actor · Universo Cinematográfico{% endblock %}

{% block contenido %}
<main class="container py-4">
    <h2 class="mb-4">Añadir actor</h2>

    <div class="row">
        <div class="col-12 col-lg-8">
            <section class="panel">
                <form action="{{ url_for('nuevo_actor') }}" method="POST">
                    <label class="form-label">Nombre</label>
                    <input class="form-control mb-3"
                           name="nombre"
                           required
                           placeholder="Ej. Robert Downey Jr.">

                    <div class="row">
                        <div class="col-12 col-md-6">
                            <label class="form-label">Fecha de nacimiento</label>
                            <input class="form-control mb-3"
                                   type="date"
                                   name="fecha_nacimiento">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">Nacionalidad</label>
                            <input class="form-control mb-3"
                                   name="nacionalidad"
                                   placeholder="Ej. Estadounidense">
                        </div>
                    </div>

                    <label class="form-label">Archivo de foto</label>
                    <input class="form-control mb-1"
                           name="foto"
                           placeholder="Ej. robert_downey.jpg">
                    <div class="form-text mb-3">
                        Guarda primero la imagen en la carpeta static/img.
                    </div>

                    <label class="form-label">Biografía</label>
                    <textarea class="form-control mb-3"
                              name="biografia"
                              rows="5"></textarea>

                    <div class="d-flex gap-2">
                        <button class="btn btn-danger">
                            Registrar actor
                        </button>
                        <a class="btn btn-secondary"
                           href="{{ url_for('catalogo_actores') }}">
                            Cancelar
                        </a>
                    </div>
                </form>
            </section>
        </div>
    </div>
</main>
{% endblock %}
