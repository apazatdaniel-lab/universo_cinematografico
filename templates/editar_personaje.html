{% extends "base.html" %}

{% block titulo %}Editar personaje · Universo Cinematográfico{% endblock %}

{% block contenido %}
<main class="container py-4">
    <h2 class="mb-4">Editar personaje</h2>

    <div class="row">
        <div class="col-12 col-lg-8">
            <section class="panel">
                <form action="{{ url_for('editar_personaje',
                                  id_personaje=personaje['id_personaje']) }}"
                      method="POST">
                    <label class="form-label">Nombre</label>
                    <input class="form-control mb-3"
                           name="nombre"
                           maxlength="80"
                           value="{{ personaje['nombre'] }}"
                           required>

                    <label class="form-label">Alias</label>
                    <input class="form-control mb-3"
                           name="alias"
                           maxlength="80"
                           value="{{ personaje['alias'] or '' }}">

                    <label class="form-label">Archivo de imagen</label>
                    <input class="form-control mb-3"
                           name="imagen"
                           value="{{ personaje['imagen'] or '' }}">

                    <label class="form-label">Descripción</label>
                    <textarea class="form-control mb-3"
                              name="descripcion"
                              rows="5">{{ personaje['descripcion'] or '' }}</textarea>

                    <div class="d-flex gap-2">
                        <button class="btn btn-primary">
                            Guardar cambios
                        </button>
                        <a class="btn btn-secondary"
                           href="{{ url_for('detalle_personaje',
                                  id_personaje=personaje['id_personaje']) }}">
                            Cancelar
                        </a>
                    </div>
                </form>
            </section>
        </div>
    </div>
</main>
{% endblock %}
