{% extends "base.html" %}

{% block titulo %}Proponer cambio · Universo Cinematográfico{% endblock %}

{% block contenido %}
<main class="container py-4">
    <h2 class="mb-2">Proponer cambio</h2>
    <p class="text-secondary mb-4">
        Modifica lo que quieras corregir de «{{ pelicula['titulo'] }}».
        Los cambios no se aplican hasta que un administrador los apruebe.
    </p>

    <div class="row">
        <div class="col-12 col-lg-8">
            <section class="panel">
                <form action="{{ url_for('proponer_cambio',
                                         id_pelicula=pelicula['id_pelicula']) }}"
                      method="POST">
                    <label class="form-label">Título</label>
                    <input class="form-control mb-3"
                           name="titulo"
                           value="{{ pelicula['titulo'] }}"
                           required>

                    <div class="row">
                        <div class="col-6">
                            <label class="form-label">Año</label>
                            <input class="form-control mb-3"
                                   type="number"
                                   name="anio"
                                   min="1888"
                                   max="2100"
                                   value="{{ pelicula['anio_estreno'] or '' }}">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Duración (min)</label>
                            <input class="form-control mb-3"
                                   type="number"
                                   name="duracion"
                                   min="1"
                                   value="{{ pelicula['duracion_minutos'] or '' }}">
                        </div>
                    </div>

                    <label class="form-label">Universo</label>
                    <select class="form-select mb-3"
                            name="id_universo" required>
                        <option value="">Selecciona un universo</option>
                        {% for universo in universos %}
                            <option value="{{ universo['id_universo'] }}"
                                {% if universo['id_universo'] == pelicula['id_universo'] %}selected{% endif %}>
                                {{ universo['nombre'] }}
                            </option>
                        {% endfor %}
                    </select>

                    <label class="form-label">Fase</label>
                    <select class="form-select mb-3" name="id_fase">
                        <option value="">Sin fase</option>
                        {% for fase in fases %}
                            <option value="{{ fase['id_fase'] }}"
                                {% if fase['id_fase'] == pelicula['id_fase'] %}selected{% endif %}>
                                {{ fase['universo'] }} - {{ fase['nombre'] }}
                            </option>
                        {% endfor %}
                    </select>

                    <label class="form-label">Archivo de portada</label>
                    <input class="form-control mb-3"
                           name="portada"
                           value="{{ pelicula['portada'] or '' }}">

                    <label class="form-label">Sinopsis</label>
                    <textarea class="form-control mb-3"
                              name="sinopsis"
                              rows="4">{{ pelicula['sinopsis'] or '' }}</textarea>

                    <label class="form-label">Enlace del tráiler</label>
                    <input class="form-control mb-3"
                           type="url"
                           name="trailer"
                           value="{{ pelicula['trailer_url'] or '' }}">

                    <div class="d-flex gap-2">
                        <button class="btn btn-warning">
                            Enviar solicitud
                        </button>
                        <a class="btn btn-secondary"
                           href="{{ url_for('catalogo_peliculas') }}">
                            Cancelar
                        </a>
                    </div>
                </form>
            </section>
        </div>
    </div>
</main>
{% endblock %}
