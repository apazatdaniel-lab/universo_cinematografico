{% extends "base.html" %}

{% block titulo %}Editar actor · Universo Cinematográfico{% endblock %}

{% block contenido %}
<main class="container py-4">
    <h2 class="mb-4">Editar actor</h2>

    <div class="row">
        <div class="col-12 col-lg-8">
            <section class="panel">
                <form action="{{ url_for('editar_actor',
                                         id_actor=actor['id_actor']) }}"
                      method="POST">
                    <label class="form-label">Nombre</label>
                    <input class="form-control mb-3"
                           name="nombre"
                           value="{{ actor['nombre'] }}"
                           required>

                    <div class="row">
                        <div class="col-12 col-md-6">
                            <label class="form-label">Fecha de nacimiento</label>
                            <input class="form-control mb-3"
                                   type="date"
                                   name="fecha_nacimiento"
                                   value="{{ actor['fecha_nacimiento'] or '' }}">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">Nacionalidad</label>
                            <input class="form-control mb-3"
                                   name="nacionalidad"
                                   value="{{ actor['nacionalidad'] or '' }}">
                        </div>
                    </div>

                    <label class="form-label">Archivo de foto</label>
                    <input class="form-control mb-3"
                           name="foto"
                           value="{{ actor['foto'] or '' }}">

                    <label class="form-label">Biografía</label>
                    <textarea class="form-control mb-3"
                              name="biografia"
                              rows="5">{{ actor['biografia'] or '' }}</textarea>

                    <div class="d-flex gap-2">
                        <button class="btn btn-primary">
                            Guardar cambios
                        </button>
                        <a class="btn btn-secondary"
                           href="{{ url_for('detalle_actor',
                                            id_actor=actor['id_actor']) }}">
                            Cancelar
                        </a>
                    </div>
                </form>
            </section>
        </div>
    </div>
</main>
{% endblock %}
