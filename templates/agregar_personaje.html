{% extends "base.html" %}

{% block titulo %}Añadir personaje · Universo Cinematográfico{% endblock %}

{% block contenido %}
<main class="container py-4">
    <h2 class="mb-4">Añadir personaje</h2>

    <div class="row">
        <div class="col-12 col-lg-8">
            <section class="panel">
                <form action="{{ url_for('nuevo_personaje') }}" method="POST">
                    <label class="form-label">Nombre</label>
                    <input class="form-control mb-3"
                           name="nombre"
                           maxlength="80"
                           required
                           placeholder="Ej. Tony Stark">

                    <label class="form-label">Alias</label>
                    <input class="form-control mb-3"
                           name="alias"
                           maxlength="80"
                           placeholder="Ej. Iron Man">

                   

                    <label class="form-label">Archivo de imagen</label>
                    <input class="form-control mb-1"
                           name="imagen"
                           placeholder="Ej. iron_man_personaje.jpg">
                    <div class="form-text mb-3">
                        Guarda primero la imagen en la carpeta static/img.
                    </div>

                    <label class="form-label">Descripción</label>
                    <textarea class="form-control mb-3"
                              name="descripcion"
                              rows="5"></textarea>

                    <div class="d-flex gap-2">
                        <button class="btn btn-danger">
                            Registrar personaje
                        </button>
                        <a class="btn btn-secondary"
                           href="{{ url_for('catalogo_personajes') }}">
                            Cancelar
                        </a>
                    </div>
                </form>
            </section>
        </div>
    </div>
</main>
{% endblock %}
