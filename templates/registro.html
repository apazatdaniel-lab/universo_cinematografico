{% extends "base.html" %}

{% block titulo %}Crear cuenta · Universo Cinematográfico{% endblock %}

{% block contenido %}
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <section class="panel">
                <h3>Crear cuenta</h3>

                <form action="{{ url_for('registro') }}" method="POST">
                    <label class="form-label">Nombre de usuario</label>
                    <input class="form-control mb-3"
                           name="nombre_usuario"
                           minlength="3"
                           maxlength="30"
                           required
                           autofocus>

                    <label class="form-label">Contraseña</label>
                    <input class="form-control mb-1"
                           type="password"
                           name="contrasena"
                           minlength="8"
                           required>
                    <div class="form-text mb-3">
                        Mínimo 8 caracteres.
                    </div>

                    <label class="form-label">Repite la contraseña</label>
                    <input class="form-control mb-3"
                           type="password"
                           name="repetir_contrasena"
                           minlength="8"
                           required>

                    <button class="btn btn-danger w-100">
                        Crear cuenta
                    </button>
                </form>

                <p class="mt-3 mb-0 text-center">
                    ¿Ya tienes cuenta?
                    <a class="link-info" href="{{ url_for('login') }}">
                        Iniciar sesión
                    </a>
                </p>
            </section>
        </div>
    </div>
</main>
{% endblock %}
